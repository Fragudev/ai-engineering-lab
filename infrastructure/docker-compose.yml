name: ai-engineering-lab

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ai_lab
      POSTGRES_USER: ai_lab
      POSTGRES_PASSWORD: ai_lab
    # No host port published: the app reaches this over the Compose network as postgres:5432,
    # and publishing 5432 collides with other local Postgres instances outside this project.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_lab -d ai_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  # KRaft mode, single combined broker+controller node. No ZooKeeper (docs/adr/0005-kafka.md).
  # Listener layout follows Apache Kafka's own reference compose example: PLAINTEXT_HOST for
  # access from the host machine, PLAINTEXT for other containers on this network.
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ai-lab-kraft-cluster-1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Topic and DLT inspection during demos (docs/architecture.md #14). Not required for Phase 0
  # acceptance, but part of the standing local infrastructure.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ai-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # OTel Collector + Prometheus + Tempo + Loki + Grafana in one container, to keep this file
  # readable (docs/architecture.md #12).
  observability:
    image: grafana/otel-lgtm:0.30.1
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      observability:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    # LM Studio runs on the host, not in Compose (AGENTS.md, Environment constraints).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  kafka-data:
