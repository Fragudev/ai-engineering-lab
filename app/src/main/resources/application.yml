spring:
  application:
    name: ai-engineering-lab
  profiles:
    active: lmstudio
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_lab
    username: ai_lab
    password: ai_lab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

ai:
  provider:
    lmstudio:
      # host.docker.internal only resolves inside a container; application-docker.yml overrides
      # this to that address. The model names must match what's actually loaded in LM Studio
      # (scripts/bootstrap.sh checks that before startup) — override via env vars if different.
      base-url: http://localhost:1234/v1
      chat-model: local-model
      embedding-model: bge-m3
      timeout: 60s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
