spring:
  application:
    name: ai-engineering-lab
  profiles:
    active: lmstudio
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_lab
    username: ai_lab
    password: ai_lab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-lab
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: io.github.fragudev.ailab.ingestion.internal
    # Opt-in even with the OTel starter present (spring.io/blog, Kafka isn't auto-instrumented) —
    # this is what stitches the ingestion pipeline's spans into one connected trace.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  ai:
    mcp:
      server:
        name: ai-engineering-lab
        type: sync
        protocol: streamable
        # Only exposes this application's own tool registry (calculator/mock-weather/
        # knowledge-base-search) — deliberately not tools later pulled in via the MCP client, see
        # docs/adr/0011-mcp-tool-exposure-boundaries.md. This is already the framework's own default,
        # named here explicitly rather than relied on silently.
        expose-mcp-client-tools: false
      client:
        # No real external MCP server exists in this project's infrastructure to point at by
        # default (docs/adr/0011-mcp-tool-exposure-boundaries.md). Override
        # spring.ai.mcp.client.enabled and .streamable-http.connections.* to point at a real MCP
        # server — docs/roadmap.md Phase 7's live verification does this against this same
        # application's own /mcp endpoint.
        enabled: false
        # mcp.internal.McpClientToolRegistrar (an ApplicationReadyEvent listener), not Spring AI's
        # own autoconfiguration, drives the handshake — calling it eagerly at bean-construction time
        # would race the embedded server not yet accepting connections in the self-connect case.
        initialized: false
        toolcallback:
          # Not used: mcp.internal.McpClientTool adapts a discovered tool into this project's own
          # Tool SPI directly, not through Spring AI's ToolCallback/ChatClient bridging — that
          # bridging would bypass ToolInvoker's scope/schema/timeout pipeline entirely.
          enabled: false

ai:
  provider:
    lmstudio:
      # host.docker.internal only resolves inside a container; application-docker.yml overrides
      # this to that address. The model names must match what's actually loaded in LM Studio
      # (scripts/bootstrap.sh checks that before startup) — override via env vars if different.
      base-url: http://localhost:1234/v1
      chat-model: local-model
      embedding-model: bge-m3
      timeout: 60s
  tools:
    enabled: true
    # Stands in for "the one authenticated user's permissions" — no real principal exists yet
    # (docs/architecture.md #13's "design" framing for authentication; single-user, no
    # multi-tenancy per AGENTS.md). See docs/adr/0009-tool-design-and-security-boundaries.md.
    granted-scopes: [calculator:use, knowledge-base:search, external-api:mock, mcp:external]
    default-timeout: 5s
    # How long a RAG-sourced tool call waits for POST /api/v1/tool-calls/{callId}:confirm before
    # resolving to TIMEOUT — distinct from a tool's own execution timeout above.
    confirmation-timeout: 60s
    # Bounds the tool-calling loop; not a general agentic loop (that's Phase 6/workflow's job).
    max-calls-per-turn: 3
  workflow:
    enabled: true
    # Reasoned starting bounds, not measured against any dataset (AGENTS.md rule 2) — same honesty
    # as ai.tools.max-calls-per-turn above. See docs/adr/0010-agent-orchestration.md.
    max-sub-queries: 4
    max-sources-to-extract: 8
    # The real, enforced T5 (denial of wallet) bound docs/threat-model.md names as planned — scoped
    # per engine invocation, not cumulative across a restart+resume.
    max-llm-calls-per-run: 20
    stage-retry-attempts: 2
    step-timeout: 30s
  mcp:
    client:
      # Stands in for "the one authenticated user's permissions" for every externally-sourced tool,
      # the same single-config-list convention as ai.tools.granted-scopes — granted by default here
      # since ToolDefinition.alwaysRequiresConfirmation (not the scope check) is the primary control
      # for an MCP-client tool (docs/threat-model.md T9).
      required-scope: mcp:external
      default-timeout: 10s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
