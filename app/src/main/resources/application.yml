spring:
  application:
    name: ai-engineering-lab
  profiles:
    active: lmstudio
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_lab
    username: ai_lab
    password: ai_lab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-lab
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: io.github.fragudev.ailab.ingestion.internal
    # Opt-in even with the OTel starter present (spring.io/blog, Kafka isn't auto-instrumented) —
    # this is what stitches the ingestion pipeline's spans into one connected trace.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

ai:
  provider:
    lmstudio:
      # host.docker.internal only resolves inside a container; application-docker.yml overrides
      # this to that address. The model names must match what's actually loaded in LM Studio
      # (scripts/bootstrap.sh checks that before startup) — override via env vars if different.
      base-url: http://localhost:1234/v1
      chat-model: local-model
      embedding-model: bge-m3
      timeout: 60s
  tools:
    enabled: true
    # Stands in for "the one authenticated user's permissions" — no real principal exists yet
    # (docs/architecture.md #13's "design" framing for authentication; single-user, no
    # multi-tenancy per AGENTS.md). See docs/adr/0009-tool-design-and-security-boundaries.md.
    granted-scopes: [calculator:use, knowledge-base:search, external-api:mock]
    default-timeout: 5s
    # How long a RAG-sourced tool call waits for POST /api/v1/tool-calls/{callId}:confirm before
    # resolving to TIMEOUT — distinct from a tool's own execution timeout above.
    confirmation-timeout: 60s
    # Bounds the tool-calling loop; not a general agentic loop (that's Phase 6/workflow's job).
    max-calls-per-turn: 3

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
