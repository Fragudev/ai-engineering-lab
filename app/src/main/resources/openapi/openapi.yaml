openapi: 3.1.0
info:
  title: AI Engineering Lab API
  version: 0.1.0
  description: >
    Hybrid RAG, event-driven ingestion, tool calling, MCP and agentic workflows on the JVM.
    Phase 1 adds the chat vertical slice: conversations, messages and SSE streaming. The full
    contract this API is built towards is recorded in docs/architecture.md (#5 API contracts) and
    implemented incrementally, phase by phase, starting with the spec rather than the controller
    (AGENTS.md, Working through a phase).
servers:
  - url: http://localhost:8080
    description: Local

paths:
  /api/v1/conversations:
    post:
      operationId: createConversation
      summary: >
        Start a new conversation. An optional ragProfile turns on retrieval-augmented answers for
        every message sent to it (see docs/architecture.md #9); omitted or null means plain chat,
        unchanged since Phase 1.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/ProblemDetail"

  /api/v1/conversations/{id}:
    get:
      operationId: getConversation
      summary: Fetch a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/ProblemDetail"

  /api/v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: List a conversation's messages, oldest first
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Messages in the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/ProblemDetail"
    post:
      operationId: sendMessage
      summary: >
        Send a user message and stream the assistant's reply token by token. Phase 1 only
        implements the streaming (Accept: text/event-stream) response; a synchronous JSON variant
        is part of the documented contract but not built until something needs it. If the
        conversation has a ragProfile (or one is given in the request, overriding it for this
        turn), the reply is retrieval-augmented and may include `citation` events.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: >
            An SSE stream. Event types: `token` (data: a content delta — citation markers are never
            present here, see the `citation` event below), `citation` (data: a Citation JSON object;
            only emitted when the turn was retrieval-augmented, once per source the model actually
            cited, sent after the last `token` and before `usage`), `tool_call` (data: a
            {callId, toolName, arguments} JSON object — the model's intent to call a tool, emitted
            in both plain chat and retrieval-augmented turns as of Phase 5), `tool_call_pending`
            (data: a {callId, toolName, arguments, confirmationTimeoutSeconds} JSON object — only
            emitted for a tool call whose turn's context contains retrieved content
            (docs/threat-model.md T2); the stream then pauses until
            `POST /api/v1/tool-calls/{callId}:confirm` resolves it or the confirmation timeout
            elapses, at which point the paused stream resumes on whichever request thread called the
            confirm endpoint), `tool_result` (data: a {callId, toolName, outcome, result, message}
            JSON object — outcome is one of OK/TIMEOUT/DENIED/ERROR), `usage` (data: a UsageSummary
            JSON object, sent once as the final event before `done`), `done` (stream finished
            normally), `error` (data: a ProblemDetail JSON object, e.g. status 504 on a provider
            timeout; the stream then closes). A mid-stream failure cannot become a real HTTP error
            status — the response is already a committed 200 SSE stream by the time a provider call
            can fail — so it surfaces in-band via the `error` event instead; that is what "a typed
            error, not a hung request" means for this endpoint specifically. `tool_call_pending` is
            new in Phase 5 — not part of architecture.md #5's original event list, added once the
            confirmation flow that document names was actually designed down to an endpoint.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: >
            The conversation does not exist. Unlike a mid-stream provider failure, this is checked
            before the SSE stream is established, so it is a real HTTP 404.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/documents:
    post:
      operationId: uploadDocument
      summary: >
        Upload a document for asynchronous ingestion (parse → chunk → embed → index over Kafka;
        docs/architecture.md #10). Scoped to text/plain and text/markdown this phase — an
        unsupported MIME type is accepted here (validation is async, at the parser stage) and
        surfaces later as the job's FAILED status with last_error populated, not as a 4xx here.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
      responses:
        "202":
          description: >
            Accepted for async processing. Location points to the ingestion job. Absent if the
            content hash already existed (see the 200 response instead).
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "200":
          description: >
            The same bytes were already uploaded (content-hash dedup) — the existing document is
            returned and nothing new was created or published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    get:
      operationId: listDocuments
      summary: List all documents
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /api/v1/documents/{id}:
    get:
      operationId: getDocument
      summary: Fetch a document
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/ProblemDetail"
    delete:
      operationId: deleteDocument
      summary: Delete a document and its chunks
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Deleted

  /api/v1/ingestion/jobs/{id}:
    get:
      operationId: getIngestionJob
      summary: >
        Job status, observable throughout the pipeline: UPLOADED → PARSED → CHUNKED → INDEXED, or
        FAILED with last_error populated once retries are exhausted at whichever stage failed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        "404":
          $ref: "#/components/responses/ProblemDetail"

  /api/v1/retrieval:search:
    post:
      operationId: searchRetrieval
      summary: >
        Debug view into the retrieval pipeline (docs/architecture.md #5): runs normalization,
        retrieval, fusion and (if the profile enables it) reranking, but never calls the model.
        Returns the rewritten query and every candidate's scores before and after fusion and
        reranking — the difference between having built a RAG pipeline and being able to explain
        what it did.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalSearchRequest"
      responses:
        "200":
          description: The retrieval trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalTrace"
        "400":
          $ref: "#/components/responses/ProblemDetail"

  /api/v1/rag/profiles:
    get:
      operationId: listRagProfiles
      summary: The fixed, named set of RAG profiles selectable per conversation or per request.
      responses:
        "200":
          description: Available profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RagProfile"

  /api/v1/tools:
    get:
      operationId: listTools
      summary: >
        The registered tool set (docs/architecture.md #4, Phase 5): calculator, mock-weather (the
        roadmap's "mock external API"), and knowledge-base-search.
      responses:
        "200":
          description: Available tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolDefinition"

  /api/v1/tools/{name}:invoke:
    post:
      operationId: invokeTool
      summary: >
        Invoke a tool directly, outside a chat turn — schema-validated, scope-checked and
        timeout-bounded, the same pipeline the chat tool-calling loop uses
        (docs/adr/0009-tool-design-and-security-boundaries.md).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInvokeRequest"
      responses:
        "200":
          description: The tool's result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInvokeResponse"
        "400":
          description: Invalid arguments — did not pass the tool's own JSON Schema.
          $ref: "#/components/responses/ProblemDetail"
        "403":
          description: Denied by scope check, before execution.
          $ref: "#/components/responses/ProblemDetail"
        "404":
          $ref: "#/components/responses/ProblemDetail"
        "504":
          description: The tool did not complete within its configured timeout.
          $ref: "#/components/responses/ProblemDetail"

  /api/v1/tool-calls/{callId}:confirm:
    post:
      operationId: confirmToolCall
      summary: >
        Resolves a pending tool-call confirmation raised mid-stream by a RAG-context turn
        (docs/threat-model.md T2). Not part of architecture.md #5's original path list — added in
        Phase 5 once the confirmation flow it names was actually designed down to an endpoint.
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolConfirmRequest"
      responses:
        "200":
          description: Resolved — the paused SSE stream resumes.
        "404":
          description: Unknown, already-resolved, or expired callId.
          $ref: "#/components/responses/ProblemDetail"

components:
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ProblemDetail:
      description: An RFC 9457 problem detail.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    Conversation:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        ragProfile:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      properties:
        ragProfile:
          type: string
          nullable: true
          description: Must name one of GET /api/v1/rag/profiles, if given.

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        model:
          type: string
          nullable: true
        promptTokens:
          type: integer
          nullable: true
        completionTokens:
          type: integer
          nullable: true
        latencyMs:
          type: integer
          format: int64
          nullable: true
        estimatedCostUsd:
          type: number
          nullable: true
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        createdAt:
          type: string
          format: date-time

    Citation:
      type: object
      required: [id, messageId, chunkId, documentId, score, ordinal, createdAt]
      properties:
        id:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        chunkId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        score:
          type: number
        quotedSpan:
          type: string
          nullable: true
          description: Best-effort — the sentence of the generated answer that carried the marker.
        ordinal:
          type: integer
          description: The [N] marker number within that answer.
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        ragProfile:
          type: string
          nullable: true
          description: >
            Overrides the conversation's own ragProfile for this turn only. Explicit empty
            string is not the same as omitted — send null or omit the field to fall back to the
            conversation's stored profile.

    RagProfile:
      type: object
      required:
        [name, topK, candidatesPerRetriever, lexicalEnabled, rerankStrategy, contextTokenBudget, maxVectorDistance]
      properties:
        name:
          type: string
        topK:
          type: integer
        candidatesPerRetriever:
          type: integer
        lexicalEnabled:
          type: boolean
        rerankStrategy:
          type: string
          enum: [NONE, MMR, LLM]
        contextTokenBudget:
          type: integer
        maxVectorDistance:
          type: number
          description: >
            Abstention gate: the profile declines to answer rather than generate from weak context
            if the best vector match is farther than this cosine distance. A starting heuristic, not
            tuned against a golden dataset (Phase 4).

    RetrievalSearchRequest:
      type: object
      required: [query, ragProfile]
      properties:
        query:
          type: string
          minLength: 1
        ragProfile:
          type: string

    RetrievalTrace:
      type: object
      required: [originalQuery, normalizedQuery, ragProfile, results]
      properties:
        originalQuery:
          type: string
        normalizedQuery:
          type: string
          description: Same as originalQuery when there's no conversation history to fold in.
        ragProfile:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"

    SearchResult:
      type: object
      required: [chunkId, documentId, content, fusedScore, finalRank]
      properties:
        chunkId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        content:
          type: string
        vectorDistance:
          type: number
          nullable: true
          description: Null when this candidate was found only by the lexical retriever.
        lexicalRank:
          type: number
          nullable: true
          description: Postgres ts_rank; null when this candidate was found only by the vector retriever.
        fusedScore:
          type: number
          description: Reciprocal Rank Fusion score, before reranking.
        rerankScore:
          type: number
          nullable: true
          description: >
            Present only for MMR reranking — a real relevance/diversity score. Null for
            RerankStrategy NONE or LLM, since an LLM reranker produces an ordering, not a
            calibrated score.
        finalRank:
          type: integer
          description: 1-based position in the final returned order, after reranking (or fusion, if none).

    Document:
      type: object
      required: [id, sourceUri, title, mimeType, contentHash, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sourceUri:
          type: string
        title:
          type: string
        mimeType:
          type: string
        contentHash:
          type: string
        status:
          type: string
          enum: [PENDING, INDEXED, FAILED]
        createdAt:
          type: string
          format: date-time

    IngestionJob:
      type: object
      required: [id, documentId, stage, attempts, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        stage:
          type: string
          enum: [UPLOADED, PARSED, CHUNKED, INDEXED, FAILED]
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ToolDefinition:
      type: object
      required: [name, version, description, inputSchemaJson, requiredScopes, timeoutSeconds]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        inputSchemaJson:
          type: string
          description: A JSON Schema (draft 2020-12) document, as a string.
        requiredScopes:
          type: array
          items:
            type: string
        timeoutSeconds:
          type: integer

    ToolInvokeRequest:
      type: object
      properties:
        arguments:
          type: object
          additionalProperties: true

    ToolInvokeResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        result:
          nullable: true
          description: The tool's result, shape defined by its own output schema.
        errorMessage:
          type: string
          nullable: true

    ToolConfirmRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean

    ProblemDetail:
      type: object
      description: RFC 9457.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
