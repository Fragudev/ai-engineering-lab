openapi: 3.1.0
info:
  title: AI Engineering Lab API
  version: 0.1.0
  description: >
    Hybrid RAG, event-driven ingestion, tool calling, MCP and agentic workflows on the JVM.
    Phase 1 adds the chat vertical slice: conversations, messages and SSE streaming. The full
    contract this API is built towards is recorded in docs/architecture.md (#5 API contracts) and
    implemented incrementally, phase by phase, starting with the spec rather than the controller
    (AGENTS.md, Working through a phase).
servers:
  - url: http://localhost:8080
    description: Local

paths:
  /api/v1/conversations:
    post:
      operationId: createConversation
      summary: Start a new conversation
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /api/v1/conversations/{id}:
    get:
      operationId: getConversation
      summary: Fetch a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/ProblemDetail"

  /api/v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: List a conversation's messages, oldest first
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Messages in the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/ProblemDetail"
    post:
      operationId: sendMessage
      summary: >
        Send a user message and stream the assistant's reply token by token. Phase 1 only
        implements the streaming (Accept: text/event-stream) response; a synchronous JSON variant
        is part of the documented contract but not built until something needs it.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: >
            An SSE stream. Event types: `token` (data: a content delta), `usage` (data: a
            UsageSummary JSON object, sent once as the final event before `done`), `done` (stream
            finished normally), `error` (data: a ProblemDetail JSON object, e.g. status 504 on a
            provider timeout; the stream then closes). A mid-stream failure cannot become a real
            HTTP error status — the response is already a committed 200 SSE stream by the time a
            provider call can fail — so it surfaces in-band via the `error` event instead; that is
            what "a typed error, not a hung request" means for this endpoint specifically. Citation
            and tool_call/tool_result event types are part of the full contract
            (docs/architecture.md #5) but have no producer until Phase 3/5.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: >
            The conversation does not exist. Unlike a mid-stream provider failure, this is checked
            before the SSE stream is established, so it is a real HTTP 404.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/documents:
    post:
      operationId: uploadDocument
      summary: >
        Upload a document for asynchronous ingestion (parse → chunk → embed → index over Kafka;
        docs/architecture.md #10). Scoped to text/plain and text/markdown this phase — an
        unsupported MIME type is accepted here (validation is async, at the parser stage) and
        surfaces later as the job's FAILED status with last_error populated, not as a 4xx here.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
      responses:
        "202":
          description: >
            Accepted for async processing. Location points to the ingestion job. Absent if the
            content hash already existed (see the 200 response instead).
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "200":
          description: >
            The same bytes were already uploaded (content-hash dedup) — the existing document is
            returned and nothing new was created or published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    get:
      operationId: listDocuments
      summary: List all documents
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /api/v1/documents/{id}:
    get:
      operationId: getDocument
      summary: Fetch a document
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/ProblemDetail"
    delete:
      operationId: deleteDocument
      summary: Delete a document and its chunks
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Deleted

  /api/v1/ingestion/jobs/{id}:
    get:
      operationId: getIngestionJob
      summary: >
        Job status, observable throughout the pipeline: UPLOADED → PARSED → CHUNKED → INDEXED, or
        FAILED with last_error populated once retries are exhausted at whichever stage failed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        "404":
          $ref: "#/components/responses/ProblemDetail"

components:
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ProblemDetail:
      description: An RFC 9457 problem detail.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    Conversation:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        ragProfile:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        model:
          type: string
          nullable: true
        promptTokens:
          type: integer
          nullable: true
        completionTokens:
          type: integer
          nullable: true
        latencyMs:
          type: integer
          format: int64
          nullable: true
        estimatedCostUsd:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    Document:
      type: object
      required: [id, sourceUri, title, mimeType, contentHash, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sourceUri:
          type: string
        title:
          type: string
        mimeType:
          type: string
        contentHash:
          type: string
        status:
          type: string
          enum: [PENDING, INDEXED, FAILED]
        createdAt:
          type: string
          format: date-time

    IngestionJob:
      type: object
      required: [id, documentId, stage, attempts, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        stage:
          type: string
          enum: [UPLOADED, PARSED, CHUNKED, INDEXED, FAILED]
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      description: RFC 9457.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
