<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Engineering Lab</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header>
  <h1>AI Engineering Lab</h1>
  <p>Phase 2 — asynchronous ingestion. Deliberately minimal: enough to demonstrate streaming, token/cost accounting, tracing, and the upload → parse → chunk → embed → index pipeline.</p>
</header>
<section id="ingestion">
  <h2>Documents</h2>
  <form id="uploadForm">
    <input id="fileInput" type="file" accept="text/plain,text/markdown,.md,.txt" />
    <button type="submit">Upload</button>
  </form>
  <div id="documentList"></div>
</section>
<div id="messages"></div>
<form id="composer">
  <input id="input" type="text" placeholder="Ask something…" autocomplete="off" />
  <button id="send" type="submit">Send</button>
</form>

<script src="/app.js"></script>
</body>
</html>
