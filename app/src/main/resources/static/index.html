<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Engineering Lab</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --user-bg: #2563eb;
    --user-fg: #ffffff;
    --assistant-bg: #f3f4f6;
    --error-bg: #fef2f2;
    --error-fg: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --border: #262a33;
      --assistant-bg: #1c2027;
      --error-bg: #2a1414;
      --error-fg: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1rem; margin: 0; }
  header p { margin: 0.2rem 0 0; font-size: 0.8rem; color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .bubble {
    max-width: 70%;
    padding: 0.6rem 0.9rem;
    border-radius: 0.75rem;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .bubble.user { align-self: flex-end; background: var(--user-bg); color: var(--user-fg); }
  .bubble.assistant { align-self: flex-start; background: var(--assistant-bg); }
  .bubble.error { align-self: flex-start; background: var(--error-bg); color: var(--error-fg); }
  .meta {
    align-self: flex-start;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: -0.4rem;
  }
  .meta a { color: inherit; }
  form {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 0.9rem;
  }
  button {
    padding: 0.6rem 1.1rem;
    border-radius: 0.5rem;
    border: none;
    background: var(--user-bg);
    color: var(--user-fg);
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>AI Engineering Lab</h1>
  <p>Phase 1 — chat vertical slice. Deliberately minimal: enough to demonstrate streaming, token/cost accounting and tracing.</p>
</header>
<div id="messages"></div>
<form id="composer">
  <input id="input" type="text" placeholder="Ask something…" autocomplete="off" />
  <button id="send" type="submit">Send</button>
</form>

<script>
(function () {
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");

  let conversationId = null;

  function addBubble(role, text) {
    const el = document.createElement("div");
    el.className = "bubble " + role;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function addMeta(html) {
    const el = document.createElement("div");
    el.className = "meta";
    el.innerHTML = html;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function ensureConversation() {
    if (conversationId) return conversationId;
    const response = await fetch("/api/v1/conversations", { method: "POST" });
    if (!response.ok) throw new Error("Could not create a conversation");
    const body = await response.json();
    conversationId = body.id;
    return conversationId;
  }

  // Native EventSource only supports GET; this endpoint takes a POST body, so the
  // text/event-stream framing is parsed by hand from a fetch() ReadableStream.
  async function streamReply(id, content, handlers) {
    const response = await fetch(`/api/v1/conversations/${id}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
      body: JSON.stringify({ content }),
    });

    if (!response.ok || !response.body) {
      const problem = await response.json().catch(() => null);
      handlers.onError(problem || { detail: response.statusText });
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let separatorIndex;
      while ((separatorIndex = buffer.indexOf("\n\n")) !== -1) {
        const rawEvent = buffer.slice(0, separatorIndex);
        buffer = buffer.slice(separatorIndex + 2);
        dispatchEvent(rawEvent, handlers);
      }
    }
  }

  function dispatchEvent(rawEvent, handlers) {
    const nameMatch = rawEvent.match(/^event:\s*(.*)$/m);
    const eventName = nameMatch ? nameMatch[1] : "message";
    const data = rawEvent
        .split("\n")
        .filter((line) => line.startsWith("data:"))
        .map((line) => line.slice(5).trimStart())
        .join("\n");

    switch (eventName) {
      case "token":
        handlers.onToken(data);
        break;
      case "usage":
        handlers.onUsage(JSON.parse(data));
        break;
      case "error":
        handlers.onError(JSON.parse(data));
        break;
      case "done":
        handlers.onDone();
        break;
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const content = input.value.trim();
    if (!content) return;

    input.value = "";
    sendButton.disabled = true;
    addBubble("user", content);
    const assistantBubble = addBubble("assistant", "");

    try {
      const id = await ensureConversation();
      await streamReply(id, content, {
        onToken: (text) => {
          assistantBubble.textContent += text;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        },
        onUsage: (usage) => {
          const trace = usage.traceId
              ? ` · <a href="http://localhost:3000/explore" target="_blank" rel="noopener">trace ${usage.traceId.slice(0, 12)}…</a>`
              : "";
          addMeta(
              `${usage.model} · ${usage.promptTokens}+${usage.completionTokens} tokens · ` +
              `${usage.latencyMs} ms · $${Number(usage.estimatedCostUsd).toFixed(4)}${trace}`
          );
        },
        onError: (problem) => {
          assistantBubble.classList.add("error");
          assistantBubble.textContent = (problem && (problem.detail || problem.title)) || "Something went wrong.";
        },
        onDone: () => {},
      });
    } catch (err) {
      assistantBubble.classList.add("error");
      assistantBubble.textContent = "Request failed: " + err.message;
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  });
})();
</script>
</body>
</html>
